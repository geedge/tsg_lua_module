image: "git.mesalab.cn:7443/mesa_platform/build-env:master"
variables:
  GIT_STRATEGY: "clone"
  BUILD_PADDING_PREFIX: /tmp/padding_for_CPACK_RPM_BUILD_SOURCE_DIRS_PREFIX_PREFIX_PREFIX_PREFIX_PREFIX_PREFIX/
  INSTALL_PREFIX: "/home/mesasoft/sapp_run/"
  INSTALL_DEPENDENCY_LIBRARY: libMESA_handle_logger-devel framework_env

stages:
- analysis
- test
- build

.build_by_travis:
  before_script:
  - mkdir -p $BUILD_PADDING_PREFIX/$CI_PROJECT_NAMESPACE/
  - ln -s $CI_PROJECT_DIR $BUILD_PADDING_PREFIX/$CI_PROJECT_PATH
  - cd $BUILD_PADDING_PREFIX/$CI_PROJECT_PATH
  - chmod +x ./ci/travis.sh
  script:
  - yum makecache
  - ./ci/travis.sh
  - cd build
  tags:
  - share

run_cppcheck:
  stage: analysis
  script:
    - mkdir build || true
    - cd build
    - cmake3 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON ..
    - cppcheck --project=compile_commands.json --enable=all --error-exitcode=1 --suppress=unusedFunction --suppress=missingInclude --suppress=uselessAssignmentPtrArg --suppress=unmatchedSuppression
  tags:
    - share

run_test:
  stage: test
  extends: .build_by_travis
  script:
    - yum makecache
    - ./ci/travis.sh
    - cd build
    - ctest --verbose  

branch_build_debug:
  stage: build
  extends: .build_by_travis
  variables:
    BUILD_TYPE: Debug
  except:
    - /^develop.*$/i
    - /^master.*$/i
    - tags

branch_build_release:
  stage: build
  variables:
    BUILD_TYPE: RelWithDebInfo
  extends: .build_by_travis
  except:
    - /^develop.*$/i
    - /^master.*$/i
    - tags

develop_build_debug:
  stage: build
  extends: .build_by_travis
  variables:
    BUILD_TYPE: Debug
    PACKAGE: 1
  artifacts:
    name: "tsg_lua_module-$CI_COMMIT_REF_NAME-debug"
    paths:
      - build/*.rpm
  only:
    - /^develop.*$/i
    - /^master.*$/i

develop_build_release:
  stage: build
  extends: .build_by_travis
  variables:
    BUILD_TYPE: RelWithDebInfo
    PACKAGE: 1
  artifacts:
    name: "tsg_lua_module-$CI_COMMIT_REF_NAME-release"
    paths:
      - build/*.rpm
  only:
    - /^develop.*$/i
    - /^master.*$/i


release_build_release:
  stage: build
  variables:
    BUILD_TYPE: RelWithDebInfo
    PACKAGE: 1
    UPLOAD: 1
    PULP3_REPO_NAME: framework-stable-x86_64.el7
    PULP3_DIST_NAME: framework-stable-x86_64.el7
  extends: .build_by_travis
  artifacts:
    name: "tsg_lua_module-$CI_COMMIT_REF_NAME-release"
    paths:
      - build/*.rpm
  only:
    - tags

